name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A branch push and a tag for its exact commit share one queue. Never cancel a release check.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      required: ${{ steps.check.outputs.required }}
    steps:
      - uses: actions/github-script@v8
        id: check
        with:
          script: |
            let required = true;
            if (context.eventName === 'push' && context.ref.startsWith('refs/tags/')) {
              try {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  ...context.repo, workflow_id: 'build.yml', head_sha: context.sha,
                  status: 'success', per_page: 100
                });
                required = !data.workflow_runs.some(run => run.id !== context.runId && run.event === 'push'
                  && run.head_branch === context.payload.repository.default_branch
                  && Date.now() - Date.parse(run.updated_at) < 60 * 60 * 1000);
              } catch (error) {
                core.warning('Could not verify an earlier build; run both platforms.');
              }
            }
            core.setOutput('required', String(required));
            core.info(required ? 'Run both platforms.' : 'Exact tagged commit already passed this workflow on both platforms.');
  build:
    needs: validation
    if: needs.validation.outputs.required == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Compile and run headless tests
        shell: bash
        run: bash ./gradlew build --no-daemon --stacktrace 2>&1 | tee gradle-build.log
      - name: Check documentation links and image resources
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/Test-Documentation.ps1
      - name: Preserve build diagnostics and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ matrix.os }}
          retention-days: 14
          path: |
            gradle-build.log
            build/test-results/test/
            build/reports/tests/test/
