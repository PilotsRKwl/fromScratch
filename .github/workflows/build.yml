name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Compile and run headless tests
        shell: bash
        run: bash ./gradlew build --no-daemon --stacktrace 2>&1 | tee gradle-build.log
      - name: Check documentation links and image resources
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/Test-Documentation.ps1
      - name: Preserve build diagnostics and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ matrix.os }}
          retention-days: 14
          path: |
            gradle-build.log
            build/test-results/test/
            build/reports/tests/test/
