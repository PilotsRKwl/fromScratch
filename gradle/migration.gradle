// Offline owner utility only. The official standard build compiles src/main alone.
sourceSets {
	migration
	migrationTest {
		compileClasspath += sourceSets.migration.output
		runtimeClasspath += sourceSets.migration.output
	}
}
dependencies {
	migrationTestImplementation 'junit:junit:4.12'
}
tasks.register('migrationTest', Test) {
	testClassesDirs = sourceSets.migrationTest.output.classesDirs
	classpath = sourceSets.migrationTest.runtimeClasspath
}
tasks.register('migrationJar', Jar) {
	from sourceSets.migration.output
	archiveFileName.set('from-scratch-migration.jar')
	manifest { attributes('Main-Class': 'com.fromscratch.migration.OfflineProgressMigration') }
}
